name: LoadRunner Cloud Test

on:
  workflow_dispatch:

jobs:
  run-lrc-test:
    runs-on: ubuntu-latest

    steps:
      - name: Run test in LoadRunner Cloud
        id: lrc_run_test
        uses: MicroFocus/lrc-gh-action@v1

        env:
          LRC_CLIENT_ID: ${{ secrets.LRC_CLIENT_ID }}
          LRC_CLIENT_SECRET: ${{ secrets.LRC_CLIENT_SECRET }}

        with:
          lrc_server: https://loadrunner-cloud.saas.microfocus.com
          lrc_tenant: "${{ vars.LRC_TENANT }}"
          lrc_project: "${{ vars.LRC_PROJECT }}"
          lrc_test_id: "${{ vars.LRC_TEST_ID }}"
          lrc_output_dir: "./results"
          lrc_report_types: "pdf,docx,csv"

      - name: Show Run ID
        run: |
          echo "LRC Run ID = ${{ steps.lrc_run_test.outputs.lrc_run_id }}"

      - name: Upload LRC Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lrc-report-${{ steps.lrc_run_test.outputs.lrc_run_id }}
          path: ./results