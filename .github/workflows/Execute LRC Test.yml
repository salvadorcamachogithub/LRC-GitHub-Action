name: Run LoadRunner Cloud Test

on:
  workflow_dispatch:

jobs:
  run-lrc-test:
    runs-on: ubuntu-latest

    environment: LRC

    steps:
      - name: Run test in LoadRunner Cloud
        id: lrc_run_test
        uses: MicroFocus/lrc-gh-action@v1

        env:
          LRC_CLIENT_ID: ${{ secrets.LRC_CLIENT_ID }}
          LRC_CLIENT_SECRET: ${{ secrets.LRC_CLIENT_SECRET }}

        with:
          lrc_server: https://loadrunner-cloud.saas.microfocus.com

          # Replace these with your actual values
          lrc_tenant: "159221713"
          lrc_project: "119"
          lrc_test_id: "4522"

          lrc_output_dir: "./results"
          lrc_report_types: "pdf,docx,csv"

      - name: Print Run ID
        if: always()
        run: |
          echo "LRC Run ID: ${{ steps.lrc_run_test.outputs.lrc_run_id }}"

      - name: List Downloaded Files
        if: always()
        run: |
          echo "Results directory contents:"
          ls -la ./results || true

      - name: Upload LRC Results
        if: always()
        uses: actions/upload-artifact@v4

        with:
          name: lrc-report-${{ steps.lrc_run_test.outputs.lrc_run_id }}
          path: ./results
          if-no-files-found: warn